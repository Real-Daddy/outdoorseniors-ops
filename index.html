<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareOS</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
/* ── Warm neutral palette ── */
:root{
  --bg:       #f0ede8;   /* warm off-white page */
  --surface:  #faf9f6;   /* card / sidebar surface */
  --border:   #dbd8d0;   /* soft warm border */
  --text:     #2e2c28;   /* dark warm brown-gray, not harsh black */
  --muted:    #7a7670;   /* secondary text */
  --accent:   #3d3a35;   /* buttons / active states */
  --danger:   #8c2020;
  --ok-bg:    #eef5ee; --ok-fg:#2a5c2a;
  --warn-bg:  #fdf5e6; --warn-fg:#7a5500;
  --err-bg:   #fdeaea; --err-fg:#8c2020;
  --info-bg:  #eaecfd; --info-fg:#2a3070;
  --pur-bg:   #f3eafd; --pur-fg:#5a1a8c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:14px}

/* ── Login ── */
#loginView{display:flex;align-items:center;justify-content:center;height:100vh;background:#1e1c18}
.login-box{background:var(--surface);padding:48px 40px;width:360px;border:1px solid var(--border)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .brand{font-size:26px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
.login-logo .brand span{color:var(--muted)}
.login-logo .sub{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:2px;text-transform:uppercase}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;border:1px solid var(--border);padding:10px 12px;font-size:14px;outline:none;background:var(--bg);color:var(--text);transition:border .15s}
.form-group input:focus{border-color:var(--accent)}
.btn-login{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;letter-spacing:.3px}
.btn-login:hover{background:#2a2822}
#loginError{color:var(--danger);font-size:12px;margin-top:10px;text-align:center;min-height:18px}

/* ── App Shell ── */
#appView{height:100vh;flex-direction:row}

/* ── Sidebar ── */
.sidebar{width:218px;min-width:218px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sidebar-logo{padding:20px 18px;border-bottom:1px solid var(--border)}
.sidebar-logo .brand{font-size:17px;font-weight:800;color:var(--text)}
.sidebar-logo .brand span{color:var(--muted)}
.sidebar-logo .sub{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.sidebar-user{padding:14px 18px;border-bottom:1px solid var(--border)}
.sidebar-user .name{font-size:13px;font-weight:700;color:var(--text)}
.sidebar-user .role{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.nav-section{padding:8px 0}
.nav-label{font-size:9px;font-weight:700;color:#b5b0a8;letter-spacing:1.5px;text-transform:uppercase;padding:8px 18px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 18px;cursor:pointer;font-size:13px;color:var(--muted);border-left:2px solid transparent;transition:all .1s}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--bg);color:var(--text);border-left-color:var(--accent);font-weight:700}
.nav-item .icon{font-size:14px;width:18px;text-align:center;opacity:.7}
.sidebar-footer{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border)}
.btn-signout{width:100%;background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px;font-size:12px;cursor:pointer;transition:all .1s}
.btn-signout:hover{background:var(--err-bg);color:var(--err-fg);border-color:var(--err-fg)}

/* ── Main ── */
.main-content{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.topbar-title{font-size:15px;font-weight:800;color:var(--text)}
.topbar-sub{font-size:11px;color:var(--muted);margin-top:2px}
.content-area{padding:20px 24px;flex:1}

/* ── KPI Cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--border);padding:18px}
.kpi-card .label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.kpi-card .value{font-size:30px;font-weight:800;color:var(--text);margin:6px 0 2px}
.kpi-card .delta{font-size:11px;color:var(--muted)}

.section-card{background:var(--surface);border:1px solid var(--border);padding:20px;margin-bottom:16px}
.section-card h2{font-size:12px;font-weight:800;margin-bottom:16px;color:var(--text);text-transform:uppercase;letter-spacing:.8px}

/* ── Forms ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.form-full{grid-column:1/-1}
.field label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);padding:8px 10px;font-size:13px;outline:none;background:var(--bg);color:var(--text);transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:64px}

/* ── Pills ── */
.pill-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill-label{display:inline-flex;align-items:center;padding:5px 12px;border:1px solid var(--border);cursor:pointer;font-size:12px;color:var(--muted);transition:all .1s;user-select:none}
.pill-label.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pill-label input{display:none}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:all .1s;letter-spacing:.2px;border:1px solid transparent}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:hover{background:#2a2822}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}.btn-secondary:hover{background:var(--bg);border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--surface);color:var(--danger);border-color:var(--danger)}.btn-danger:hover{background:var(--err-bg)}
.btn-ghost{background:var(--bg);color:var(--muted);border-color:var(--border)}.btn-ghost:hover{color:var(--text);border-color:var(--muted)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-wa{background:#25d366;color:#fff;border-color:#25d366}.btn-wa:hover{background:#128c7e}

/* ── Table ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);color:var(--muted);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
tr:hover td{background:var(--bg)}
.badge{display:inline-block;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.2px}
.badge-default{background:#eee;color:var(--muted)}
.badge-ok{background:var(--ok-bg);color:var(--ok-fg)}
.badge-warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge-err{background:var(--err-bg);color:var(--err-fg)}
.badge-info{background:var(--info-bg);color:var(--info-fg)}
.badge-purple{background:var(--pur-bg);color:var(--pur-fg)}

/* ── Search bar ── */
.search-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search-bar input,.search-bar select{border:1px solid var(--border);padding:7px 10px;font-size:13px;outline:none;background:var(--bg);color:var(--text)}
.search-bar input:focus,.search-bar select:focus{border-color:var(--accent)}

/* ── AI Box ── */
.ai-box{background:#1e1c18;padding:24px;color:#f0ede8;margin-bottom:20px}
.ai-box h2{font-size:15px;font-weight:800;margin-bottom:4px}
.ai-box p{font-size:12px;color:#857f74;margin-bottom:14px}
.ai-input-row{display:flex;gap:8px}
.ai-input-row input{flex:1;border:1px solid #3a3830;padding:10px 14px;font-size:13px;outline:none;background:#2a2822;color:#f0ede8}
.ai-input-row input::placeholder{color:#5a5650}
.ai-input-row input:focus{border-color:#6a6450}
.ai-input-row button{background:var(--surface);color:var(--text);border:none;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer}
.ai-input-row button:hover{background:#e5e0d8}
.ai-response{margin-top:14px;padding:14px;background:#2a2822;border:1px solid #3a3830;font-size:13px;line-height:1.7;color:#c8c0b0;white-space:pre-wrap;display:none}

/* ── Result cards ── */
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.result-card{background:var(--surface);border:1px solid var(--border);padding:16px;transition:border-color .1s}
.result-card:hover{border-color:var(--accent)}
.rc-avatar{width:48px;height:48px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;overflow:hidden;flex-shrink:0}
.rc-avatar img{width:100%;height:100%;object-fit:cover}
.rc-name{font-size:14px;font-weight:800;color:var(--text)}
.rc-meta{font-size:11px;color:var(--muted);margin:3px 0 8px}
.rc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.rc-tag{background:var(--bg);color:var(--muted);font-size:10px;padding:2px 7px;border:1px solid var(--border);font-weight:600}
.rc-actions{display:flex;gap:5px;flex-wrap:wrap}
.match-score{display:inline-block;background:var(--accent);color:#fff;padding:3px 10px;font-size:11px;font-weight:800;margin-bottom:6px}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(30,28,24,.65);z-index:1000;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);padding:28px;width:90%;max-width:600px;max-height:90vh;overflow-y:auto;position:relative;border:1px solid var(--border)}
.modal h2{font-size:14px;font-weight:800;margin-bottom:18px;text-transform:uppercase;letter-spacing:.5px}
.modal-close{position:absolute;top:14px;right:18px;font-size:20px;cursor:pointer;color:var(--muted);background:none;border:none;line-height:1}
.modal-close:hover{color:var(--text)}

/* ── Tabs ── */
.tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab-btn{padding:8px 18px;border:none;font-size:11px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;letter-spacing:.5px;transition:all .1s}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--text)}

/* ── Period toggle ── */
.period-toggle{display:flex;margin-bottom:18px;border:1px solid var(--border);width:fit-content}
.period-btn{padding:6px 16px;border:none;border-right:1px solid var(--border);font-size:11px;font-weight:700;cursor:pointer;background:var(--surface);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.period-btn:last-child{border-right:none}
.period-btn.active{background:var(--accent);color:#fff}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;padding:12px 18px;font-size:13px;z-index:9999;transform:translateY(60px);opacity:0;transition:all .25s;max-width:320px;border-left:3px solid #fff}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:var(--danger)}
.toast.success{border-left-color:#7bc87b}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.dl-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg);padding:10px 14px;margin-bottom:10px;border:1px solid var(--border);flex-wrap:wrap;gap:8px}
.dl-bar span{font-size:12px;color:var(--muted);font-weight:700}
/* ── AI Chat ── */
.ai-chat-msg{padding:10px 14px;max-width:86%}
.ai-chat-bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start}
.ai-chat-user{background:var(--accent);color:#fff;align-self:flex-end;margin-left:auto}
.ai-chat-name{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;opacity:.6}
.ai-chat-text{font-size:13px;line-height:1.65;white-space:pre-wrap}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
  <div class="login-box">
    <div class="login-logo">
      <div class="brand">Care<span>OS</span></div>
      <div class="sub">OutdoorSeniors Operations</div>
    </div>
    <h2 style="font-size:14px;font-weight:700;margin-bottom:18px;color:var(--text)">Sign in</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In →</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="appView" style="display:none;height:100vh;flex-direction:row">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="brand">Care<span>OS</span></div>
      <div class="sub">OutdoorSeniors</div>
    </div>
    <div class="sidebar-user">
      <div class="name" id="sidebarName">—</div>
      <div class="role" id="sidebarRole">—</div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Main</div>
      <div class="nav-item active" onclick="showSection('home')" id="nav-home"><span class="icon">⌂</span> Home</div>
    </div>
    <div class="nav-section" id="navAdminSections" style="display:none">
      <div class="nav-label">Admin</div>
      <div class="nav-item" onclick="showSection('agentOps')" id="nav-agentOps"><span class="icon">◈</span> Agent Ops</div>
      <div class="nav-item" onclick="showSection('analytics')" id="nav-analytics"><span class="icon">▦</span> Analytics</div>
      <div class="nav-item" onclick="showSection('oms')" id="nav-oms"><span class="icon">☰</span> OMS</div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Operations</div>
      <div class="nav-item" onclick="showSection('supplyOps')" id="nav-supplyOps"><span class="icon">✦</span> Supply Ops</div>
      <div class="nav-item" onclick="showSection('customerOps')" id="nav-customerOps"><span class="icon">◎</span> Customer Ops</div>
    </div>
    <div class="sidebar-footer">
      <button class="btn-signout" onclick="doSignOut()">Sign Out</button>
    </div>
  </nav>

  <div class="main-content">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbarTitle">Home</div>
        <div class="topbar-sub" id="topbarSub"></div>
      </div>
      <div style="font-size:11px;color:var(--muted)" id="topbarDate"></div>
    </div>
    <div class="content-area" id="contentArea"></div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-bg" id="ctModal"><div class="modal" id="ctModalInner" style="max-width:640px"></div></div>

<div class="modal-bg" id="agentModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('agentModal')">×</button>
    <h2 id="agentModalTitle">Add Agent</h2>
    <div class="form-grid">
      <div class="field"><label>Full Name</label><input type="text" id="agName"></div>
      <div class="field"><label>Email</label><input type="email" id="agEmail"></div>
      <div class="field"><label>Password</label><input type="password" id="agPass" placeholder="min 6 chars"></div>
      <div class="field"><label>Phone</label><input type="tel" id="agPhone"></div>
    </div>
    <div style="margin-top:18px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('agentModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveAgent()">Save Agent</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="custModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('custModal')">×</button>
    <h2 id="custModalTitle">Add Customer</h2>
    <div class="form-grid">
      <div class="field"><label>Full Name *</label><input type="text" id="cuName"></div>
      <div class="field"><label>Phone</label><input type="tel" id="cuPhone"></div>
      <div class="field form-full"><label>Email</label><input type="email" id="cuEmail"></div>
      <div class="field form-full"><label>Address</label><input type="text" id="cuAddress"></div>
      <div class="field"><label>Area / Locality</label><input type="text" id="cuArea"></div>
      <div class="field"><label>Pincode</label><input type="text" id="cuPin"></div>
      <div class="field form-full"><label>Notes</label><textarea id="cuNotes" rows="2"></textarea></div>
    </div>
    <div style="margin-top:18px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('custModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveCustomer()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="orderModal">
  <div class="modal" style="max-width:700px">
    <button class="modal-close" onclick="closeModal('orderModal')">×</button>
    <h2 id="orderModalTitle">Create Order</h2>
    <input type="hidden" id="ordEditId">
    <div class="form-grid cols3">
      <div class="field"><label>Customer *</label><select id="ordCustomer" style="width:100%"></select></div>
      <div class="field"><label>Patient Name *</label><input type="text" id="ordPatient"></div>
      <div class="field"><label>Patient Age</label><input type="number" id="ordAge" min="0" max="120"></div>
      <div class="field"><label>Weight (kg)</label><input type="number" id="ordWeight"></div>
      <div class="field"><label>Caretaker Gender</label>
        <select id="ordGender"><option value="">Any</option><option>Male</option><option>Female</option></select>
      </div>
      <div class="field"><label>Package Type</label><select id="ordPackage"></select></div>
      <div class="field"><label>Start Date</label><input type="date" id="ordStart"></div>
      <div class="field"><label>Duration</label><input type="text" id="ordDuration" placeholder="e.g. 3 months"></div>
      <div class="field"><label>Location / Area</label><input type="text" id="ordLocation"></div>
      <div class="field"><label>Pincode</label><input type="text" id="ordPincode"></div>
      <div class="field form-full"><label>Medical Conditions</label><input type="text" id="ordMedical" placeholder="Leave blank if none"></div>
      <div class="field form-full">
        <label>Languages Preferred</label>
        <div class="pill-group" id="langPills"></div>
      </div>
      <div class="field form-full">
        <label>On Diapers?</label>
        <div class="pill-group">
          <label class="pill-label"><input type="radio" name="diapers" value="Yes" onchange="radioSync('diapers')"> Yes</label>
          <label class="pill-label"><input type="radio" name="diapers" value="No" onchange="radioSync('diapers')"> No</label>
        </div>
      </div>
      <div class="field form-full">
        <label>Care For</label>
        <div class="pill-group">
          <label class="pill-label"><input type="radio" name="forWhom" value="Self" onchange="radioSync('forWhom');toggleRel()"> Self</label>
          <label class="pill-label"><input type="radio" name="forWhom" value="Someone else" onchange="radioSync('forWhom');toggleRel()"> Someone else</label>
        </div>
      </div>
      <div class="field" id="relField" style="display:none"><label>Relationship</label><input type="text" id="ordRel" placeholder="e.g. Parent, Spouse"></div>
      <div class="field form-full"><label>Notes</label><textarea id="ordNotes" rows="2"></textarea></div>
    </div>
    <div style="margin-top:18px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('orderModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveOrder()">Save Order</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="assignModal">
  <div class="modal" style="max-width:460px">
    <button class="modal-close" onclick="closeModal('assignModal')">×</button>
    <h2>Assign Caretaker</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Order: <strong id="assignOrderLabel"></strong></p>
    <div class="field"><label>Select Caretaker</label><select id="assignCtSelect" style="width:100%"></select></div>
    <div style="margin-top:18px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('assignModal')">Cancel</button>

}
function buildAgentsTable() {
  if (!allAgents.length) return `<tr><td colspan="5" class="empty-state">No agents yet.</td></tr>`;
  return allAgents.map(a=>`<tr>
    <td><strong>${esc(a.name)}</strong></td><td>${esc(a.email)}</td><td>${esc(a.phone||'—')}</td>
    <td><span class="badge ${a.active===false?'badge-err':'badge-ok'}">${a.active===false?'Inactive':'Active'}</span></td>
    <td><div style="display:flex;gap:5px">
      <button class="btn btn-ghost btn-sm" onclick="openAgentModal('${a.id}')">Edit</button>
      <button class="btn ${a.active===false?'btn-secondary':'btn-danger'} btn-sm" onclick="toggleAgent('${a.id}',${a.active!==false})">${a.active===false?'Activate':'Deactivate'}</button>
    </div></td>
  </tr>`).join('');
}
function openAgentModal(id) {
  editingAgentId=id||null;
  document.getElementById('agentModalTitle').textContent=id?'Edit Agent':'Add Agent';
  document.getElementById('agPass').placeholder=id?'Leave blank to keep':'min 6 chars';
  if(id){const a=allAgents.find(x=>x.id===id);if(a){document.getElementById('agName').value=a.name||'';document.getElementById('agEmail').value=a.email||'';document.getElementById('agPhone').value=a.phone||'';document.getElementById('agPass').value='';}}
  else ['agName','agEmail','agPass','agPhone'].forEach(x=>document.getElementById(x).value='');
  openModal('agentModal');
}
let _secondaryApp=null;
async function saveAgent() {
  const name=document.getElementById('agName').value.trim(),email=document.getElementById('agEmail').value.trim();
  const pass=document.getElementById('agPass').value,phone=document.getElementById('agPhone').value.trim();
  if(!name||!email){toast('Name and email required','error');return;}
  try{
    if(editingAgentId){
      await db.collection('users').doc(editingAgentId).update({name,phone});
      const idx=allAgents.findIndex(a=>a.id===editingAgentId);if(idx>=0){allAgents[idx].name=name;allAgents[idx].phone=phone;}
      toast('Agent updated');
    }else{
      if(!pass||pass.length<6){toast('Password must be 6+ chars','error');return;}
      if(!_secondaryApp)_secondaryApp=firebase.initializeApp(firebaseConfig,'secondary');
      const cred=await _secondaryApp.auth().createUserWithEmailAndPassword(email,pass);
      await _secondaryApp.auth().signOut();
      const profile={name,email,phone,role:'agent',active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
      await db.collection('users').doc(cred.user.uid).set(profile);
      allAgents.push({id:cred.user.uid,...profile});
      toast('Agent created');
    }
    closeModal('agentModal');
    const t=document.getElementById('agentsTable');if(t)t.innerHTML=buildAgentsTable();
  }catch(e){toast(e.message,'error');}
}
async function toggleAgent(id,deactivate){
  await db.collection('users').doc(id).update({active:!deactivate});
  const a=allAgents.find(x=>x.id===id);if(a)a.active=!deactivate;
  const t=document.getElementById('agentsTable');if(t)t.innerHTML=buildAgentsTable();
  toast(deactivate?'Agent deactivated':'Agent activated');
}

function renderCtTable(){
  const data=allCaretakers.filter(c=>{
    if(ctFilter.q&&!c.name?.toLowerCase().includes(ctFilter.q.toLowerCase())&&!(c.phone||'').includes(ctFilter.q))return false;
    if(ctFilter.gender&&c.gender!==ctFilter.gender)return false;
    if(ctFilter.area&&!(c.area||'').toLowerCase().includes(ctFilter.area.toLowerCase()))return false;
    if(ctFilter.lang&&!(c.languages||[]).includes(ctFilter.lang))return false;
    return true;
  });

function doSearch(){
  const q=(document.getElementById('smQ')?.value||'').trim().toLowerCase();
  const gender=document.getElementById('smGender')?.value||'';
  const area=(document.getElementById('smArea')?.value||'').trim().toLowerCase();
  const lang=document.getElementById('smLang')?.value||'';
  const maxSal=parseFloat(document.getElementById('smSalary')?.value)||Infinity;
  const minExp=parseFloat(document.getElementById('smExp')?.value)||0;
  const box=document.getElementById('searchResults');
  if(!box)return;
  box.innerHTML=`<div style="padding:20px;color:var(--muted)"><span class="spinner"></span> Searching…</div>`;

  const results=allCaretakers.filter(c=>{
    if(q&&!( (c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q) ))return false;
    if(gender&&c.gender!==gender)return false;
    if(area&&!( (c.area||'').toLowerCase().includes(area)||(c.address||'').toLowerCase().includes(area) ))return false;
    if(lang&&!(c.languages||[]).includes(lang))return false;
    if(isFinite(maxSal)&&c.salary&&parseFloat(c.salary)>maxSal)return false;
    if(minExp>0&&(parseFloat(c.experience)||0)<minExp)return false;
    return true;
  });

  lastSearchResults=results;
  showResultCards(results,false,box);
}

function showResultCards(results,isAI,box){
  if(!results.length){box.innerHTML=`<div class="empty-state">No caretakers found.</div>`;return;}
  const dlBar=`<div class="dl-bar"><span>${results.length} profile${results.length!==1?'s':''} found</span><div style="display:flex;gap:6px"><button class="btn btn-primary btn-sm" onclick="printAllProfiles(false)">Print All — Full</button><button class="btn btn-ghost btn-sm" onclick="printAllProfiles(true)">Print All — Brief</button></div></div>`;
  const cards=results.map(c=>{
    const initials=(c.name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    return`<div class="result-card">
      <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:10px">
        <div class="rc-avatar">${c.photoURL?`<img src="${esc(c.photoURL)}" onerror="this.style.display='none'">`:initials}</div>
        <div style="flex:1;min-width:0">
          ${isAI&&c._score!==undefined?`<div class="match-score">${c._score}% match</div>`:''}
          <div class="rc-name">${esc(c.name)}</div>
          <div class="rc-meta">${[c.gender,c.age?c.age+'y':'',c.salary?'₹'+c.salary+'/mo':'',c.experience?c.experience+'y exp':''].filter(Boolean).join(' · ')}</div>
          ${isAI&&c._reason?`<div style="font-size:11px;color:var(--muted);font-style:italic;margin-bottom:6px">${esc(c._reason)}</div>`:''}
          <div class="rc-tags">${(c.languages||[]).slice(0,3).map(l=>`<span class="rc-tag">${l}</span>`).join('')}${c.area?`<span class="rc-tag">📍 ${esc(c.area)}</span>`:''}</div>
        </div>
      </div>

        <button class="btn btn-ghost btn-sm" onclick="viewCaretaker('${c.id}')">View</button>

        <button class="btn btn-ghost btn-sm" onclick="printProfile('${c.id}',true)">Brief Profile</button>
      </div>
    </div>`;
  }).join('');
  box.innerHTML=dlBar+`<div class="result-grid">${cards}</div>`;
}

async function saveCustomer(){
  const name=document.getElementById('cuName').value.trim();if(!name){toast('Name required','error');return;}
  const data={name,phone:document.getElementById('cuPhone').value.trim(),email:document.getElementById('cuEmail').value.trim(),address:document.getElementById('cuAddress').value.trim(),area:document.getElementById('cuArea').value.trim(),pincode:document.getElementById('cuPin').value.trim(),notes:document.getElementById('cuNotes').value.trim()};
  try{
    if(editingCustomerId){await db.collection('customers').doc(editingCustomerId).update(data);const idx=allCustomers.findIndex(c=>c.id===editingCustomerId);if(idx>=0)allCustomers[idx]={...allCustomers[idx],...data};toast('Customer updated');}

async function loadComments(orderId){
  const box=document.getElementById('commentsList');if(!box)return;
  try{
    const snap=await db.collection('comments').where('orderId','==',orderId).get();
    if(snap.empty){box.innerHTML=`<div style="color:var(--muted);font-size:12px;padding:4px 0">No comments yet.</div>`;return;}
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.toDate?.()?.getTime()||0)-(b.createdAt?.toDate?.()?.getTime()||0));
    box.innerHTML=docs.map(cm=>{
      const dt=cm.createdAt?.toDate?cm.createdAt.toDate().toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
      return`<div style="background:var(--bg);border:1px solid var(--border);padding:10px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <strong style="font-size:12px">${esc(cm.agentName||'Unknown')}</strong>
          <span style="font-size:10px;color:var(--muted)">${dt}</span>
        </div>
        <div style="font-size:13px;white-space:pre-wrap">${esc(cm.text)}</div>
      </div>`;
    }).join('');
  }catch(e){box.innerHTML=`<div style="color:var(--danger);font-size:12px">Could not load comments: ${e.message}</div>`;}
}

async function findMatches(orderId){
  const o=allOrders.find(x=>x.id===orderId);if(!o)return;
  if(custTab!=='orders'){custTab='orders';renderCustomerOps(document.getElementById('contentArea'));await new Promise(r=>setTimeout(r,300));}
  let box=document.getElementById('matchBox');
  if(!box){box=document.createElement('div');box.id='matchBox';document.getElementById('contentArea').appendChild(box);}
  box.innerHTML=`<div class="section-card"><h2>Finding Matches — ${esc(o.orderId)}</h2><div style="padding:16px;color:var(--muted)"><span class="spinner"></span>AI is matching…</div></div>`;
  const candidates=allCaretakers.filter(c=>!(o.caretakerGender&&c.gender&&c.gender!==o.caretakerGender));
  if(!candidates.length){box.innerHTML=`<div class="section-card"><h2>No Candidates</h2><p style="color:var(--muted);font-size:13px">No caretakers match the gender requirement.</p></div>`;return;}
  const prompt=`You are a caretaker-matching AI. Find top 5 best matches for this care order.
ORDER: Patient=${o.patientName||'?'}, Age=${o.patientAge||'?'}, Medical=${o.medicalConditions||'none'}, Package=${o.packageType}, Location=${o.location||'?'}, Languages preferred=${(o.languagesPreferred||[]).join(',')||'any'}, Caretaker gender=${o.caretakerGender||'any'}, On diapers=${o.onDiapers||'No'}, Duration=${o.duration||'?'}.
CARETAKERS: ${JSON.stringify(candidates.slice(0,25).map(c=>({id:c.id,name:c.name,gender:c.gender,age:c.age,area:c.area,languages:c.languages||[],workPreferences:c.workPreferences||[],experience:c.experience,salary:c.salary})))}
Return ONLY a valid JSON array (no markdown): [{"id":"...","name":"...","score":85,"reason":"..."}] sorted by score descending.`;
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    const data=await res.json();
    const raw=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
    const m=raw.match(/\[[\s\S]*?\]/);
    let matches=[];
    if(m){const ranked=JSON.parse(m[0]);matches=ranked.map(r=>{const c=allCaretakers.find(x=>x.id===r.id);return c?{...c,_score:r.score,_reason:r.reason||''}:null;}).filter(Boolean);}
    if(!matches.length){box.innerHTML=`<div class="section-card"><h2>No AI Matches</h2><p style="color:var(--muted);font-size:13px">Try assigning manually.</p></div>`;return;}
    const cards=matches.map(c=>{
      const initials=(c.name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      return`<div class="result-card">
        <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:10px">
          <div class="rc-avatar">${c.photoURL?`<img src="${esc(c.photoURL)}" onerror="this.style.display='none'">`:initials}</div>
          <div style="flex:1">
            <div class="match-score">${c._score}% match</div>
            <div class="rc-name">${esc(c.name)}</div>
            <div class="rc-meta">${[c.gender,c.age?c.age+'y':'',c.salary?'₹'+c.salary+'/mo':'',c.experience?c.experience+'y exp':''].filter(Boolean).join(' · ')}</div>
            ${c._reason?`<div style="font-size:11px;color:var(--muted);font-style:italic;margin-bottom:6px">${esc(c._reason)}</div>`:''}
            <div class="rc-tags">${(c.languages||[]).slice(0,3).map(l=>`<span class="rc-tag">${l}</span>`).join('')}${c.area?`<span class="rc-tag">📍 ${esc(c.area)}</span>`:''}</div>
          </div>
        </div>
        <div class="rc-actions">
          <button class="btn btn-ghost btn-sm" onclick="viewCaretaker('${c.id}')">View</button>
          <button class="btn btn-primary btn-sm" onclick="assignFromMatch('${orderId}','${c.id}','${c.name.replace(/'/g,"\\'")}')">Assign</button>
          <button class="btn btn-secondary btn-sm" onclick="printProfile('${c.id}',false)">Full Profile</button>
          <button class="btn btn-ghost btn-sm" onclick="printProfile('${c.id}',true)">Brief Profile</button>
          ${c.phone?`<button class="btn btn-wa btn-sm" onclick="shareWhatsApp('${c.id}','${orderId}')">WhatsApp</button>`:''}
        </div>
      </div>`;
    }).join('');
    box.innerHTML=`<div class="section-card"><h2>Top ${matches.length} Matches — ${esc(o.orderId)}</h2><div class="result-grid">${cards}</div></div>`;
  }catch(e){console.error(e);box.innerHTML=`<div class="section-card"><p style="color:var(--danger);font-size:13px">Error: ${e.message}</p></div>`;}
}

  const ct=allCaretakers.find(x=>x.id===ctId);
  await db.collection('orders').doc(assignOrderRef.id).update({assignedCaretakerId:ctId,assignedCaretakerName:ct?.name||'',status:'assigned'});
  const idx=allOrders.findIndex(o=>o.id===assignOrderRef.id);if(idx>=0){allOrders[idx].assignedCaretakerId=ctId;allOrders[idx].assignedCaretakerName=ct?.name||'';allOrders[idx].status='assigned';}
  toast('Assigned','success');closeModal('assignModal');
  renderOrdTable(document.getElementById('ordSearch')?.value||'',document.getElementById('ordStatusFilter')?.value||'');
}

// ══ ANALYTICS ══
function renderAnalytics(ca){
  const now=new Date();
  const getStart=mode=>{if(mode==='daily')return new Date(now.getFullYear(),now.getMonth(),now.getDate());if(mode==='weekly'){const d=new Date(now);d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d;}return new Date(now.getFullYear(),now.getMonth(),1);};
  const start=getStart(periodMode);
  const byP=arr=>arr.filter(x=>{try{return x.createdAt?.toDate()>=start;}catch{return false;}});
  const op=byP(allOrders),cp=byP(allCustomers),ctp=byP(allCaretakers);
  const assigned=allOrders.filter(o=>o.status==='assigned'||o.status==='active');
  const pending=allOrders.filter(o=>o.status==='pending');
  const rate=allOrders.length?Math.round(assigned.length/allOrders.length*100):0;
  ca.innerHTML=`
  <div class="period-toggle">
    <button class="period-btn ${periodMode==='daily'?'active':''}" onclick="periodMode='daily';renderAnalytics(document.getElementById('contentArea'))">Daily</button>
    <button class="period-btn ${periodMode==='weekly'?'active':''}" onclick="periodMode='weekly';renderAnalytics(document.getElementById('contentArea'))">Weekly</button>
    <button class="period-btn ${periodMode==='monthly'?'active':''}" onclick="periodMode='monthly';renderAnalytics(document.getElementById('contentArea'))">Monthly</button>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="label">New Orders</div><div class="value">${op.length}</div><div class="delta">this ${periodMode} · ${allOrders.length} total</div></div>
    <div class="kpi-card"><div class="label">New Customers</div><div class="value">${cp.length}</div><div class="delta">this ${periodMode} · ${allCustomers.length} total</div></div>
    <div class="kpi-card"><div class="label">New Caretakers</div><div class="value">${ctp.length}</div><div class="delta">this ${periodMode} · ${allCaretakers.length} total</div></div>
    <div class="kpi-card"><div class="label">Assigned</div><div class="value">${assigned.length}</div><div class="delta">${rate}% rate</div></div>
    <div class="kpi-card"><div class="label">Pending</div><div class="value">${pending.length}</div><div class="delta">unassigned</div></div>
    <div class="kpi-card"><div class="label">Agents</div><div class="value">${allAgents.length}</div></div>
  </div>
  <div class="section-card"><h2>Orders by Status</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${['pending','matched','assigned','active','closed'].map(s=>{const n=allOrders.filter(o=>o.status===s).length,pct=allOrders.length?Math.round(n/allOrders.length*100):0;return`<div style="flex:1;min-width:90px;border:1px solid var(--border);padding:14px;text-align:center"><div style="font-size:26px;font-weight:800">${n}</div><div style="font-size:10px;color:var(--muted);text-transform:capitalize;font-weight:700;margin:2px 0">${s}</div><div style="font-size:10px;color:var(--muted)">${pct}%</div></div>`;}).join('')}
    </div>
  </div>
  <div class="section-card"><h2>Package Distribution</h2>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${CARE_PACKAGES.map(p=>{const n=allOrders.filter(o=>o.packageType===p).length;if(!n)return'';const pct=allOrders.length?Math.round(n/allOrders.length*100):0;return`<div style="display:flex;align-items:center;gap:10px"><div style="width:180px;font-size:12px;color:var(--muted);flex-shrink:0">${p}</div><div style="flex:1;background:var(--bg);height:16px;overflow:hidden"><div style="width:${pct}%;background:var(--accent);height:100%"></div></div><div style="width:30px;font-size:12px;font-weight:700;text-align:right">${n}</div></div>`;}).join('')||'<div class="empty-state">No orders yet.</div>'}
    </div>
  </div>`;
}

// ══ OMS ══
function renderOMS(ca){
  const now=new Date();
  const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const weekStart=new Date(now);weekStart.setDate(weekStart.getDate()-weekStart.getDay());weekStart.setHours(0,0,0,0);
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const byDate=s=>allOrders.filter(o=>{try{return o.createdAt?.toDate()>=s;}catch{return false;}});
  const unassigned=allOrders.filter(o=>!o.assignedCaretakerId&&o.status!=='closed');
  ca.innerHTML=`
  <div class="kpi-grid">
    <div class="kpi-card"><div class="label">Today</div><div class="value">${byDate(todayStart).length}</div><div class="delta">new orders</div></div>
    <div class="kpi-card"><div class="label">This Week</div><div class="value">${byDate(weekStart).length}</div></div>
    <div class="kpi-card"><div class="label">This Month</div><div class="value">${byDate(monthStart).length}</div></div>
    <div class="kpi-card"><div class="label">Unassigned</div><div class="value">${unassigned.length}</div><div class="delta">need action</div></div>
    <div class="kpi-card"><div class="label">Total Orders</div><div class="value">${allOrders.length}</div></div>
  </div>
  <div class="section-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="margin:0">All Orders</h2>
      <select onchange="omsFilter(this.value)" style="border:1px solid var(--border);padding:6px 10px;font-size:12px;outline:none;background:var(--bg)">
        <option value="">All Status</option><option>pending</option><option>matched</option><option>assigned</option><option>active</option><option>closed</option><option>cancelled</option>
      </select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Order ID</th><th>Customer</th><th>Patient</th><th>Package</th><th>Status</th><th>Agent</th><th>Assigned To</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="omsTable">${buildOmsTable('')}</tbody>
    </table></div>
  </div>`;
}
function omsFilter(s){const t=document.getElementById('omsTable');if(t)t.innerHTML=buildOmsTable(s);}
function buildOmsTable(status){
  const data=status?allOrders.filter(o=>o.status===status):allOrders;
  if(!data.length)return`<tr><td colspan="10" class="empty-state">No orders.</td></tr>`;
  const sb={pending:'badge-warn',matched:'badge-info',assigned:'badge-purple',active:'badge-ok',closed:'badge-default',cancelled:'badge-err'};
  return data.map(o=>`<tr>
    <td><strong style="font-family:monospace;font-size:11px;cursor:pointer;color:var(--accent);text-decoration:underline" onclick="viewOrder('${o.id}')">${esc(o.orderId)}</strong></td>
    <td><span style="cursor:pointer;color:var(--accent)" onclick="viewCustomer('${o.customerId}')">${esc(o.customerName||'—')}</span></td>
    <td>${esc(o.patientName||'—')}</td>
    <td style="font-size:12px">${esc(o.packageType||'—')}</td>
    <td><span class="badge ${sb[o.status]||'badge-default'}">${o.status}</span></td>
    <td style="font-size:12px">${esc(o.createdBy||'—')}</td>
    <td style="font-size:12px">${o.assignedCaretakerName?`<span style="color:var(--ok-fg);font-weight:700">${esc(o.assignedCaretakerName)}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
    <td style="font-size:12px">${o.createdAt?.toDate?o.createdAt.toDate().toLocaleDateString('en-IN'):''}</td>
    <td>
      <select onchange="updateOrdStatus('${o.id}',this.value);this.closest('tr').querySelector('.oms-status-badge').className='badge ${sb[this.value]||'badge-default'}';this.closest('tr').querySelector('.oms-status-badge').textContent=this.value" style="border:1px solid var(--border);padding:4px 6px;font-size:11px;outline:none;background:var(--bg)">
        ${['pending','matched','assigned','active','closed','cancelled'].map(s=>`<option${o.status===s?' selected':''}>${s}</option>`).join('')}
      </select>
    </td>
    <td>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="openAssign('${o.id}')">${o.assignedCaretakerId?'Reassign':'Assign'}</button>
        ${o.assignedCaretakerId?`<button class="btn btn-ghost btn-sm" onclick="omsRemoveCaretaker('${o.id}')">Remove</button>`:''}
        ${o.status!=='cancelled'&&o.status!=='closed'?`<button class="btn btn-danger btn-sm" onclick="omsCancelOrder('${o.id}')">Cancel</button>`:''}
      </div>
    </td>
  </tr>`).join('');
}
async function updateOrdStatus(id,status){
  await db.collection('orders').doc(id).update({status});
  const idx=allOrders.findIndex(o=>o.id===id);if(idx>=0)allOrders[idx].status=status;
  toast(`Status → ${status}`);
}
async function omsRemoveCaretaker(id){
  if(!confirm('Remove the assigned caretaker from this order? Status will return to pending.'))return;
  await db.collection('orders').doc(id).update({assignedCaretakerId:'',assignedCaretakerName:'',status:'pending'});
  const idx=allOrders.findIndex(o=>o.id===id);
  if(idx>=0){allOrders[idx].assignedCaretakerId='';allOrders[idx].assignedCaretakerName='';allOrders[idx].status='pending';}
  toast('Caretaker removed — order set to pending');
  omsFilter(document.querySelector('#contentArea select')?.value||'');
}
async function omsCancelOrder(id){
  if(!confirm('Cancel this order? This cannot be undone easily.'))return;
  await db.collection('orders').doc(id).update({status:'cancelled'});
  const idx=allOrders.findIndex(o=>o.id===id);if(idx>=0)allOrders[idx].status='cancelled';
  toast('Order cancelled','error');
  omsFilter(document.querySelector('#contentArea select')?.value||'');
}

// ── Utils ──
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function syncPill(cb){cb.parentElement.classList.toggle('on',cb.checked);}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('open');}));
let _tt=null;
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3200);}
