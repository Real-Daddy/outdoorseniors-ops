<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareOS — OutdoorSeniors Operations</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e;height:100vh;overflow:hidden}

/* ── Login ── */
#loginView{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%)}
.login-box{background:#fff;border-radius:16px;padding:48px 40px;width:380px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .brand{font-size:32px;font-weight:800;color:#0f172a;letter-spacing:-1px}
.login-logo .brand span{color:#3b82f6}
.login-logo .sub{font-size:12px;color:#64748b;margin-top:4px;letter-spacing:2px;text-transform:uppercase}
.login-box h2{font-size:18px;font-weight:600;margin-bottom:24px;color:#0f172a}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:14px;outline:none;transition:border .2s}
.form-group input:focus{border-color:#3b82f6}
.btn-primary{width:100%;background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:8px}
.btn-primary:hover{background:#2563eb}
#loginError{color:#ef4444;font-size:13px;margin-top:12px;text-align:center;min-height:20px}

/* ── App Shell ── */
#appView{height:100vh;flex-direction:row}

/* ── Sidebar ── */
.sidebar{width:240px;min-width:240px;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid #1e293b}
.sidebar-logo .brand{font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.5px}
.sidebar-logo .brand span{color:#3b82f6}
.sidebar-logo .sub{font-size:10px;color:#475569;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.sidebar-user{padding:16px 20px;border-bottom:1px solid #1e293b}
.sidebar-user .name{font-size:13px;font-weight:600;color:#e2e8f0}
.sidebar-user .role{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.nav-section{padding:12px 0}
.nav-label{font-size:10px;font-weight:700;color:#334155;letter-spacing:1.5px;text-transform:uppercase;padding:8px 20px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:background .15s;font-size:13.5px;color:#94a3b8;border-left:3px solid transparent}
.nav-item:hover{background:#1e293b;color:#e2e8f0}
.nav-item.active{background:#1e3a5f;color:#60a5fa;border-left-color:#3b82f6;font-weight:600}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid #1e293b}
.btn-signout{width:100%;background:#1e293b;color:#94a3b8;border:none;border-radius:8px;padding:9px;font-size:13px;cursor:pointer;transition:background .15s}
.btn-signout:hover{background:#ef4444;color:#fff}

/* ── Main Content ── */
.main-content{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;min-height:64px}
.topbar-title{font-size:20px;font-weight:700;color:#0f172a}
.topbar-sub{font-size:13px;color:#64748b}
.content-area{padding:24px 28px;flex:1}

/* ── Cards & Grid ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.kpi-card .label{font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kpi-card .value{font-size:32px;font-weight:800;color:#0f172a;margin:6px 0}
.kpi-card .delta{font-size:12px;color:#10b981}
.section-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:20px}
.section-card h2{font-size:16px;font-weight:700;margin-bottom:16px;color:#0f172a}

/* ── Forms ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.form-full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none;transition:border .2s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#3b82f6}
.field textarea{resize:vertical;min-height:72px}

/* Pills */
.pill-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pill-label{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;border:1.5px solid #e2e8f0;cursor:pointer;font-size:13px;color:#475569;transition:all .15s;user-select:none}
.pill-label.on{background:#3b82f6;border-color:#3b82f6;color:#fff;font-weight:600}
.pill-label input{display:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;border:none;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
.btn-green{background:#10b981;color:#fff}.btn-green:hover{background:#059669}
.btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
.btn-ghost{background:#f1f5f9;color:#475569;border:1.5px solid #e2e8f0}.btn-ghost:hover{background:#e2e8f0}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-wa{background:#25d366;color:#fff}.btn-wa:hover{background:#128c7e}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:#f8fafc;color:#475569;font-weight:700;text-align:left;padding:10px 14px;border-bottom:2px solid #e2e8f0;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{padding:11px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.3px}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-green{background:#d1fae5;color:#065f46}
.badge-yellow{background:#fef9c3;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-gray{background:#f1f5f9;color:#475569}
.badge-purple{background:#ede9fe;color:#5b21b6}

/* Search bar */
.search-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search-bar input,.search-bar select{border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13.5px;outline:none;background:#fff}
.search-bar input:focus,.search-bar select:focus{border-color:#3b82f6}
.search-bar input[type=text]{min-width:180px}

/* AI Box */
.ai-box{background:linear-gradient(135deg,#1e3a5f,#0f172a);border-radius:16px;padding:28px;color:#fff;margin-bottom:24px}
.ai-box h2{font-size:20px;font-weight:700;margin-bottom:6px}
.ai-box p{font-size:14px;color:#94a3b8;margin-bottom:18px}
.ai-input-row{display:flex;gap:10px}
.ai-input-row input{flex:1;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 16px;font-size:14px;outline:none;background:rgba(255,255,255,.1);color:#fff}
.ai-input-row input::placeholder{color:#64748b}
.ai-input-row input:focus{border-color:#3b82f6;background:rgba(255,255,255,.15)}
.ai-input-row button{background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer}
.ai-input-row button:hover{background:#2563eb}
.ai-response{margin-top:16px;padding:16px;background:rgba(255,255,255,.07);border-radius:10px;font-size:14px;line-height:1.7;color:#e2e8f0;white-space:pre-wrap;display:none}

/* Result cards */
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
.result-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);border:1.5px solid #f1f5f9;transition:box-shadow .2s}
.result-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.rc-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
.rc-avatar img{width:100%;height:100%;object-fit:cover}
.rc-name{font-size:16px;font-weight:700;color:#0f172a}
.rc-meta{font-size:12.5px;color:#64748b;margin:4px 0 10px}
.rc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.rc-tag{background:#f1f5f9;color:#475569;font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600}
.rc-actions{display:flex;gap:6px;flex-wrap:wrap}
.match-score{display:inline-block;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;margin-bottom:8px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:32px;width:90%;max-width:620px;max-height:90vh;overflow-y:auto;position:relative}
.modal h2{font-size:20px;font-weight:700;margin-bottom:20px}
.modal-close{position:absolute;top:16px;right:20px;font-size:22px;cursor:pointer;color:#94a3b8;background:none;border:none;line-height:1}
.modal-close:hover{color:#ef4444}

/* Tabs */
.tab-bar{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:10px;margin-bottom:20px;width:fit-content}
.tab-btn{padding:8px 18px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#64748b;transition:all .15s}
.tab-btn.active{background:#fff;color:#3b82f6;box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* Period toggle */
.period-toggle{display:flex;gap:6px;margin-bottom:20px}
.period-btn{padding:6px 16px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#64748b;transition:all .15s}
.period-btn.active{background:#3b82f6;border-color:#3b82f6;color:#fff}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:14px 20px;border-radius:10px;font-size:14px;z-index:9999;transform:translateY(100px);opacity:0;transition:all .3s;max-width:340px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left:4px solid #10b981}
.toast.error{border-left:4px solid #ef4444}

.empty-state{text-align:center;padding:48px 24px;color:#94a3b8;font-size:14px}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.dl-bar{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border-radius:10px;padding:12px 16px;margin-bottom:12px;border:1.5px solid #e2e8f0;flex-wrap:wrap;gap:8px}
.dl-bar span{font-size:13px;color:#475569;font-weight:600}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginView">
  <div class="login-box">
    <div class="login-logo">
      <div class="brand">Care<span>OS</span></div>
      <div class="sub">OutdoorSeniors Operations</div>
    </div>
    <h2>Sign in to continue</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@outdoorseniors.com" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" onclick="doLogin()">Sign In</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="appView" style="display:none;height:100vh;flex-direction:row">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="brand">Care<span>OS</span></div>
      <div class="sub">OutdoorSeniors</div>
    </div>
    <div class="sidebar-user">
      <div class="name" id="sidebarName">—</div>
      <div class="role" id="sidebarRole">—</div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Main</div>
      <div class="nav-item active" onclick="showSection('home')" id="nav-home"><span class="icon">🏠</span> Home</div>
    </div>
    <div class="nav-section" id="navAdminSections" style="display:none">
      <div class="nav-label">Admin</div>
      <div class="nav-item" onclick="showSection('agentOps')" id="nav-agentOps"><span class="icon">👥</span> Agent Ops</div>
      <div class="nav-item" onclick="showSection('analytics')" id="nav-analytics"><span class="icon">📊</span> Analytics</div>
      <div class="nav-item" onclick="showSection('oms')" id="nav-oms"><span class="icon">📦</span> OMS</div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Operations</div>
      <div class="nav-item" onclick="showSection('supplyOps')" id="nav-supplyOps"><span class="icon">🧑‍⚕️</span> Supply Ops</div>
      <div class="nav-item" onclick="showSection('customerOps')" id="nav-customerOps"><span class="icon">🤝</span> Customer Ops</div>
    </div>
    <div class="sidebar-footer">
      <button class="btn-signout" onclick="doSignOut()">Sign Out</button>
    </div>
  </nav>

  <div class="main-content">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbarTitle">Home</div>
        <div class="topbar-sub" id="topbarSub"></div>
      </div>
      <div style="font-size:13px;color:#94a3b8" id="topbarDate"></div>
    </div>
    <div class="content-area" id="contentArea"></div>
  </div>
</div>

<!-- ══ MODALS ══ -->
<div class="modal-bg" id="ctModal"><div class="modal" id="ctModalInner"></div></div>

<div class="modal-bg" id="agentModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('agentModal')">×</button>
    <h2 id="agentModalTitle">Add Agent</h2>
    <div class="form-grid">
      <div class="field"><label>Full Name</label><input type="text" id="agName"></div>
      <div class="field"><label>Email</label><input type="email" id="agEmail"></div>
      <div class="field"><label>Password</label><input type="password" id="agPass" placeholder="min 6 chars"></div>
      <div class="field"><label>Phone</label><input type="tel" id="agPhone"></div>
    </div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('agentModal')">Cancel</button>
      <button class="btn btn-blue" onclick="saveAgent()">Save Agent</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="custModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('custModal')">×</button>
    <h2 id="custModalTitle">Add Customer</h2>
    <div class="form-grid">
      <div class="field"><label>Full Name *</label><input type="text" id="cuName"></div>
      <div class="field"><label>Phone</label><input type="tel" id="cuPhone"></div>
      <div class="field form-full"><label>Email</label><input type="email" id="cuEmail"></div>
      <div class="field form-full"><label>Address</label><input type="text" id="cuAddress"></div>
      <div class="field"><label>Area / Locality</label><input type="text" id="cuArea"></div>
      <div class="field"><label>Pincode</label><input type="text" id="cuPin"></div>
      <div class="field form-full"><label>Notes</label><textarea id="cuNotes" rows="2"></textarea></div>
    </div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('custModal')">Cancel</button>
      <button class="btn btn-blue" onclick="saveCustomer()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="orderModal">
  <div class="modal" style="max-width:720px">
    <button class="modal-close" onclick="closeModal('orderModal')">×</button>
    <h2 id="orderModalTitle">Create Order</h2>
    <input type="hidden" id="ordEditId">
    <div class="form-grid cols3">
      <div class="field"><label>Customer *</label><select id="ordCustomer" style="width:100%"></select></div>
      <div class="field"><label>Patient Name *</label><input type="text" id="ordPatient"></div>
      <div class="field"><label>Patient Age</label><input type="number" id="ordAge" min="0" max="120"></div>
      <div class="field"><label>Weight (kg)</label><input type="number" id="ordWeight"></div>
      <div class="field"><label>Caretaker Gender</label>
        <select id="ordGender"><option value="">Any</option><option>Male</option><option>Female</option></select>
      </div>
      <div class="field"><label>Package Type</label><select id="ordPackage"></select></div>
      <div class="field"><label>Preferred Start Date</label><input type="date" id="ordStart"></div>
      <div class="field"><label>Duration</label><input type="text" id="ordDuration" placeholder="e.g. 3 months"></div>
      <div class="field"><label>Location / Area</label><input type="text" id="ordLocation"></div>
      <div class="field"><label>Pincode</label><input type="text" id="ordPincode"></div>
      <div class="field form-full"><label>Medical Conditions</label><input type="text" id="ordMedical" placeholder="e.g. Diabetes, Hypertension (leave blank if none)"></div>
      <div class="field form-full">
        <label>Languages Preferred</label>
        <div class="pill-group" id="langPills"></div>
      </div>
      <div class="field form-full">
        <label>On Diapers?</label>
        <div class="pill-group">
          <label class="pill-label" id="pill-diapers-yes"><input type="radio" name="diapers" value="Yes" onchange="radioSync('diapers')"> Yes</label>
          <label class="pill-label" id="pill-diapers-no"><input type="radio" name="diapers" value="No" onchange="radioSync('diapers')"> No</label>
        </div>
      </div>
      <div class="field form-full">
        <label>Care For</label>
        <div class="pill-group">
          <label class="pill-label"><input type="radio" name="forWhom" value="Self" onchange="radioSync('forWhom');toggleRel()"> Self</label>
          <label class="pill-label"><input type="radio" name="forWhom" value="Someone else" onchange="radioSync('forWhom');toggleRel()"> Someone else</label>
        </div>
      </div>
      <div class="field" id="relField" style="display:none"><label>Relationship</label><input type="text" id="ordRel" placeholder="e.g. Parent, Spouse"></div>
      <div class="field form-full"><label>Additional Notes</label><textarea id="ordNotes" rows="2"></textarea></div>
    </div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('orderModal')">Cancel</button>
      <button class="btn btn-blue" onclick="saveOrder()">Save Order</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="assignModal">
  <div class="modal" style="max-width:500px">
    <button class="modal-close" onclick="closeModal('assignModal')">×</button>
    <h2>Assign Caretaker</h2>
    <p style="font-size:13px;color:#64748b;margin-bottom:16px">Order: <strong id="assignOrderLabel"></strong></p>
    <div class="field"><label>Select Caretaker</label><select id="assignCtSelect" style="width:100%"></select></div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('assignModal')">Cancel</button>
      <button class="btn btn-green" onclick="confirmAssign()">Assign</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Init ──
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

let currentUser = null, currentProfile = null;
let allCaretakers = [], allCustomers = [], allOrders = [], allAgents = [];
let editingAgentId = null, editingCustomerId = null, editingOrderId = null;
let assignOrderDoc = null, lastSearchResults = [], currentSection = 'home';
let supplyTab = 'list', custTab = 'cust', periodMode = 'daily';

const LANGUAGES = ['English','Hindi','Telugu','Tamil','Kannada','Malayalam','Marathi','Bengali','Gujarati','Odia','Punjabi','Urdu'];
const CARE_PACKAGES = [
  '12-Hour Day Shift','12-Hour Night Shift','24-Hour Live-in Care',
  'Monthly Elder Care','Monthly Child Care','Monthly Patient Care',
  '4-Hour Morning Visit','4-Hour Evening Visit','Post-Surgery Care',

auth.onAuthStateChanged(async user => {
  if (!user) { showLogin(); return; }
  currentUser = user;
  const snap = await db.collection('users').doc(user.uid).get();
  if (!snap.exists) {
    const p = { name: user.email.split('@')[0], email: user.email, role: 'admin', phone: '', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
    await db.collection('users').doc(user.uid).set(p);
    currentProfile = p;
  } else {
    currentProfile = snap.data();
  }
  showApp();
});

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();

// ── Data Load ──
async function loadAllData() {
  const [ctSnap, cuSnap, ordSnap] = await Promise.all([
    db.collection('caretakers').orderBy('createdAt','desc').get(),
    db.collection('customers').orderBy('createdAt','desc').get(),
    db.collection('orders').orderBy('createdAt','desc').get()
  ]);
  allCaretakers = ctSnap.docs.map(d => ({id:d.id,...d.data()}));
  allCustomers  = cuSnap.docs.map(d => ({id:d.id,...d.data()}));
  allOrders     = ordSnap.docs.map(d => ({id:d.id,...d.data()}));

    const agSnap = await db.collection('users').where('role','==','agent').get();
    allAgents = agSnap.docs.map(d => ({id:d.id,...d.data()}));

}

let _secondaryApp = null;
async function saveAgent() {
  const name=document.getElementById('agName').value.trim(), email=document.getElementById('agEmail').value.trim();
  const pass=document.getElementById('agPass').value, phone=document.getElementById('agPhone').value.trim();
  if (!name||!email) { toast('Name and email required','error'); return; }
  try {
    if (editingAgentId) {
      await db.collection('users').doc(editingAgentId).update({name,phone});
      const idx=allAgents.findIndex(a=>a.id===editingAgentId);
      if(idx>=0){allAgents[idx].name=name;allAgents[idx].phone=phone;}
      toast('Agent updated');
    } else {
      if (!pass||pass.length<6){toast('Password must be 6+ chars','error');return;}
      if (!_secondaryApp) _secondaryApp=firebase.initializeApp(FIREBASE_CONFIG,'secondary');
      const cred=await _secondaryApp.auth().createUserWithEmailAndPassword(email,pass);
      await _secondaryApp.auth().signOut();
      const profile={name,email,phone,role:'agent',active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
      await db.collection('users').doc(cred.user.uid).set(profile);
      allAgents.push({id:cred.user.uid,...profile});
      toast('Agent created');
    }
    closeModal('agentModal');
    const t=document.getElementById('agentsTable');if(t)t.innerHTML=buildAgentsTable();
  } catch(e){toast(e.message,'error');}
}

async function toggleAgent(id,deactivate) {
  await db.collection('users').doc(id).update({active:!deactivate});
  const a=allAgents.find(x=>x.id===id);if(a)a.active=!deactivate;
  const t=document.getElementById('agentsTable');if(t)t.innerHTML=buildAgentsTable();
  toast(deactivate?'Agent deactivated':'Agent activated');
}

async function doSearch(useAI) {
  const q=document.getElementById('smQ')?.value.trim().toLowerCase();
  const gender=document.getElementById('smGender')?.value;
  const area=document.getElementById('smArea')?.value.trim().toLowerCase();
  const lang=document.getElementById('smLang')?.value;
  const maxSal=parseFloat(document.getElementById('smSalary')?.value)||Infinity;
  const minExp=parseFloat(document.getElementById('smExp')?.value)||0;
  const aiQ=document.getElementById('smAiQ')?.value.trim();
  const box=document.getElementById('searchResults');
  box.innerHTML=`<div style="padding:24px;text-align:center"><span class="spinner"></span>${useAI?'AI matching…':'Searching…'}</div>`;
  let results=allCaretakers.filter(c=>{
    if(q&&!c.name?.toLowerCase().includes(q)&&!c.phone?.includes(q))return false;
    if(gender&&c.gender!==gender)return false;
    if(area&&!c.area?.toLowerCase().includes(area)&&!c.address?.toLowerCase().includes(area))return false;
    if(lang&&!c.languages?.includes(lang))return false;
    if(c.salary&&parseFloat(c.salary)>maxSal)return false;
    if(c.experience&&parseFloat(c.experience)<minExp)return false;
    return true;
  });
  if(useAI&&aiQ&&results.length>0){
    const prompt=`You are a caretaker-matching AI. Given requirement: "${aiQ}", rank these caretakers (score 0-100). Return ONLY JSON array: [{id,score,reason}] sorted by score desc.\nCaretakers:\n${JSON.stringify(results.map(c=>({id:c.id,name:c.name,gender:c.gender,age:c.age,area:c.area,languages:c.languages,workPreferences:c.workPreferences,experience:c.experience,salary:c.salary,notes:c.notes})))}`;
    try {
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
      const data=await res.json();
      const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'[]';
      const jsonStr=text.match(/\[[\s\S]*\]/)?.[0];
      if(jsonStr){
        const ranked=JSON.parse(jsonStr);
        results=ranked.map(r=>{const c=results.find(x=>x.id===r.id);return c?{...c,_score:r.score,_reason:r.reason}:null;}).filter(Boolean).slice(0,10);
      }
    } catch(e){console.error(e);}
  }
  lastSearchResults=results;
  showResultCards(results,useAI,box);
}

function showResultCards(results,isAI,box) {
  if(!results.length){box.innerHTML=`<div class="empty-state">No matching caretakers found.</div>`;return;}
  const dlBar=`<div class="dl-bar"><span>${results.length} profile${results.length!==1?'s':''} found</span><div style="display:flex;gap:8px"><button class="btn btn-blue btn-sm" onclick="downloadAllProfiles(false)">↓ All Full PDF</button><button class="btn btn-ghost btn-sm" onclick="downloadAllProfiles(true)">↓ All Brief PDF</button></div></div>`;

async function downloadProfile(c,redacted) {
  if(!c)return;
  const el=document.createElement('div');
  el.style.cssText='position:fixed;top:0;left:-1600px;width:720px;z-index:-1;background:#fff';
  el.innerHTML=generateProfileHTML(c,redacted);
  document.body.appendChild(el);
  const safe=(c.name||'caretaker').replace(/\s+/g,'_');
  await html2pdf().set({margin:[8,8,8,8],filename:`${safe}_${redacted?'brief':'full'}.pdf`,image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,useCORS:true,logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).save();
  document.body.removeChild(el);
}

  editingCustomerId=id||null;

  }else['cuName','cuPhone','cuEmail','cuAddress','cuArea','cuPin','cuNotes'].forEach(x=>document.getElementById(x).value='');

}

async function saveCustomer() {
  const name=document.getElementById('cuName').value.trim();
  if(!name){toast('Name required','error');return;}
  const data={name,phone:document.getElementById('cuPhone').value.trim(),email:document.getElementById('cuEmail').value.trim(),address:document.getElementById('cuAddress').value.trim(),area:document.getElementById('cuArea').value.trim(),pincode:document.getElementById('cuPin').value.trim(),notes:document.getElementById('cuNotes').value.trim()};
  try{
    if(editingCustomerId){
      await db.collection('customers').doc(editingCustomerId).update(data);
      const idx=allCustomers.findIndex(c=>c.id===editingCustomerId);if(idx>=0)allCustomers[idx]={...allCustomers[idx],...data};
      toast('Customer updated');
    }else{
      data.createdBy=currentProfile?.name||currentUser?.email||'Agent';data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      const ref=await db.collection('customers').add(data);allCustomers.unshift({id:ref.id,...data});
      toast('Customer added');
    }
    closeModal('custModal');renderCuTable(document.getElementById('cuSearch')?.value||'');
  }catch(e){toast(e.message,'error');}
}

async function deleteCust(id) {
  if(!confirm('Delete this customer?'))return;
  await db.collection('customers').doc(id).delete();
  allCustomers=allCustomers.filter(c=>c.id!==id);renderCuTable('');toast('Deleted');
}

function openOrderModal(orderId,prefillCustomerId) {
  editingOrderId=orderId||null;

  document.getElementById('ordEditId').value=orderId||'';
  const sel=document.getElementById('ordCustomer');
  sel.innerHTML=`<option value="">— Select Customer —</option>`+allCustomers.map(c=>`<option value="${c.id}"${c.id===prefillCustomerId?' selected':''}>${esc(c.name)} (${esc(c.phone||'')})</option>`).join('');
  document.getElementById('ordPackage').innerHTML=CARE_PACKAGES.map(p=>`<option>${p}</option>`).join('');
  document.getElementById('langPills').innerHTML=LANGUAGES.map(l=>`<label class="pill-label"><input type="checkbox" value="${l}" onchange="syncPill(this)"> ${l}</label>`).join('');
  ['ordPatient','ordAge','ordWeight','ordDuration','ordLocation','ordPincode','ordMedical','ordNotes','ordRel'].forEach(x=>{const el=document.getElementById(x);if(el)el.value='';});
  document.getElementById('ordStart').value='';document.getElementById('ordGender').value='';document.getElementById('relField').style.display='none';
  document.querySelectorAll('[name=diapers],[name=forWhom]').forEach(r=>{r.checked=false;r.parentElement.classList.remove('on');});
  if(orderId){
    const o=allOrders.find(x=>x.id===orderId);

      sel.value=o.customerId||'';
      document.getElementById('ordPatient').value=o.patientName||'';document.getElementById('ordAge').value=o.patientAge||'';document.getElementById('ordWeight').value=o.patientWeight||'';
      document.getElementById('ordGender').value=o.caretakerGender||'';document.getElementById('ordPackage').value=o.packageType||CARE_PACKAGES[0];
      document.getElementById('ordStart').value=o.preferredStartDate||'';document.getElementById('ordDuration').value=o.duration||'';
      document.getElementById('ordLocation').value=o.location||'';document.getElementById('ordPincode').value=o.pincode||'';
      document.getElementById('ordMedical').value=o.medicalConditions||'';document.getElementById('ordNotes').value=o.notes||'';
      (o.languagesPreferred||[]).forEach(l=>{const cb=[...document.querySelectorAll('#langPills input')].find(x=>x.value===l);if(cb){cb.checked=true;cb.parentElement.classList.add('on');}});
      if(o.onDiapers){const r=[...document.querySelectorAll('[name=diapers]')].find(x=>x.value===o.onDiapers);if(r){r.checked=true;r.parentElement.classList.add('on');}}
      if(o.forSelf){const r=[...document.querySelectorAll('[name=forWhom]')].find(x=>x.value===o.forSelf);if(r){r.checked=true;r.parentElement.classList.add('on');}}
      if(o.forSelf&&o.forSelf!=='Self'){document.getElementById('relField').style.display='block';document.getElementById('ordRel').value=o.relationship||'';}
    }
  }
  openModal('orderModal');
}

function toggleRel(){const s=[...document.querySelectorAll('[name=forWhom]')].find(r=>r.checked);document.getElementById('relField').style.display=(s&&s.value==='Someone else')?'block':'none';}
function radioSync(name){document.querySelectorAll(`[name=${name}]`).forEach(r=>r.parentElement.classList.toggle('on',r.checked));}

function genOrderId(){
  const d=new Date(),dt=d.getFullYear().toString()+(d.getMonth()+1).toString().padStart(2,'0')+d.getDate().toString().padStart(2,'0');
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return`ORD-${dt}-${Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}`;
}

async function saveOrder(){
  const custId=document.getElementById('ordCustomer').value,patientName=document.getElementById('ordPatient').value.trim();
  if(!custId){toast('Select a customer','error');return;}if(!patientName){toast('Patient name required','error');return;}
  const cust=allCustomers.find(c=>c.id===custId);
  const langs=[...document.querySelectorAll('#langPills input:checked')].map(x=>x.value);
  const diapers=[...document.querySelectorAll('[name=diapers]')].find(r=>r.checked)?.value||'No';
  const forSel=[...document.querySelectorAll('[name=forWhom]')].find(r=>r.checked)?.value||'Self';
  const data={customerId:custId,customerName:cust?.name||'',customerPhone:cust?.phone||'',patientName,patientAge:document.getElementById('ordAge').value||'',patientWeight:document.getElementById('ordWeight').value||'',caretakerGender:document.getElementById('ordGender').value,packageType:document.getElementById('ordPackage').value,preferredStartDate:document.getElementById('ordStart').value,duration:document.getElementById('ordDuration').value.trim(),location:document.getElementById('ordLocation').value.trim(),pincode:document.getElementById('ordPincode').value.trim(),medicalConditions:document.getElementById('ordMedical').value.trim(),languagesPreferred:langs,onDiapers:diapers,forSelf:forSel,relationship:forSel!=='Self'?document.getElementById('ordRel').value.trim():'',notes:document.getElementById('ordNotes').value.trim(),status:'pending'};
  try{
    if(editingOrderId){
      await db.collection('orders').doc(editingOrderId).update(data);
      const idx=allOrders.findIndex(o=>o.id===editingOrderId);if(idx>=0)allOrders[idx]={...allOrders[idx],...data};
      toast('Order updated');
    }else{
      data.orderId=genOrderId();data.createdBy=currentProfile?.name||currentUser?.email||'Agent';data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      const ref=await db.collection('orders').add(data);allOrders.unshift({id:ref.id,...data});
      toast(`Order ${data.orderId} created ✓`,'success');
    }
    closeModal('orderModal');renderOrdTable(document.getElementById('ordSearch')?.value||'',document.getElementById('ordStatusFilter')?.value||'');
  }catch(e){toast(e.message,'error');}
}

// ─ View Order ─
function viewOrder(id){
  const o=allOrders.find(x=>x.id===id);if(!o)return;
  const sb={pending:'badge-yellow',matched:'badge-blue',assigned:'badge-purple',active:'badge-green',closed:'badge-gray'};
  document.getElementById('ctModalInner').innerHTML=`
  <button class="modal-close" onclick="closeModal('ctModal')">×</button>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
    <div><div style="font-size:11px;color:#64748b;font-weight:700;letter-spacing:1px;text-transform:uppercase">Order</div>
      <h2 style="margin:4px 0;font-family:monospace">${esc(o.orderId)}</h2>
      <span class="badge ${sb[o.status]||'badge-gray'}">${o.status}</span></div>
    <div style="font-size:12px;color:#94a3b8">${o.createdAt?.toDate?o.createdAt.toDate().toLocaleDateString('en-IN'):''}</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13.5px;margin-bottom:16px">
    <div><strong>Customer:</strong> ${esc(o.customerName||'—')}</div><div><strong>Phone:</strong> ${esc(o.customerPhone||'—')}</div>
    <div><strong>Patient:</strong> ${esc(o.patientName||'—')}</div><div><strong>Age/Weight:</strong> ${o.patientAge||'—'}y / ${o.patientWeight||'—'}kg</div>
    <div><strong>Package:</strong> ${esc(o.packageType||'—')}</div><div><strong>Start:</strong> ${o.preferredStartDate||'—'}</div>
    <div><strong>Duration:</strong> ${esc(o.duration||'—')}</div><div><strong>Location:</strong> ${esc(o.location||'—')} ${o.pincode?'('+o.pincode+')':''}</div>
    <div><strong>Gender pref:</strong> ${o.caretakerGender||'Any'}</div><div><strong>Diapers:</strong> ${o.onDiapers||'No'}</div>
    <div><strong>Medical:</strong> ${esc(o.medicalConditions||'None')}</div><div><strong>Languages:</strong> ${(o.languagesPreferred||[]).join(', ')||'Any'}</div>
    <div style="grid-column:1/-1"><strong>For:</strong> ${o.forSelf||'Self'}${o.relationship?' ('+o.relationship+')':''}</div>
    ${o.notes?`<div style="grid-column:1/-1"><strong>Notes:</strong> ${esc(o.notes)}</div>`:''}
    ${o.assignedCaretakerName?`<div style="grid-column:1/-1;color:#10b981"><strong>✓ Assigned To:</strong> ${esc(o.assignedCaretakerName)}</div>`:''}
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    ${!o.assignedCaretakerId?`<button class="btn btn-green" onclick="closeModal('ctModal');findMatches('${o.id}')">✨ Find Matches</button>`:''}
    ${!o.assignedCaretakerId?`<button class="btn btn-blue" onclick="closeModal('ctModal');openAssign('${o.id}')">Assign Caretaker</button>`:''}
    <button class="btn btn-ghost" onclick="closeModal('ctModal');openOrderModal('${o.id}')">Edit</button>
  </div>`;
  openModal('ctModal');
}

// ─ Find Matches ─
async function findMatches(orderId){
  const o=allOrders.find(x=>x.id===orderId);if(!o)return;
  if(custTab!=='orders'){custTab='orders';renderCustomerOps(document.getElementById('contentArea'));await new Promise(r=>setTimeout(r,300));}
  let box=document.getElementById('matchBox');
  if(!box){box=document.createElement('div');box.id='matchBox';document.getElementById('contentArea').appendChild(box);}
  box.innerHTML=`<div class="section-card"><h2>✨ Finding Matches for ${esc(o.orderId)}</h2><div style="text-align:center;padding:24px"><span class="spinner"></span> Asking AI…</div></div>`;
  const candidates=allCaretakers.filter(c=>{
    if(o.caretakerGender&&c.gender!==o.caretakerGender)return false;
    return true;
  });
  const prompt=`You are a caretaker-matching AI for a home-care agency in India. Match caretakers to this order:
ORDER: Patient=${o.patientName}, Age=${o.patientAge}, Medical=${o.medicalConditions||'none'}, Package=${o.packageType}, Location=${o.location}, Languages preferred=${(o.languagesPreferred||[]).join(',')}, Caretaker gender=${o.caretakerGender||'any'}, On diapers=${o.onDiapers}, Duration=${o.duration}.
CARETAKERS: ${JSON.stringify(candidates.slice(0,30).map(c=>({id:c.id,name:c.name,gender:c.gender,age:c.age,area:c.area,languages:c.languages,workPreferences:c.workPreferences,experience:c.experience,salary:c.salary})))}
Return ONLY a JSON array of top 5 best matches: [{id,name,score,reason}] sorted by score descending.`;
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    const data=await res.json();
    const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'[]';
    const jsonStr=text.match(/\[[\s\S]*\]/)?.[0];
    let matches=[];
    if(jsonStr){const ranked=JSON.parse(jsonStr);matches=ranked.map(r=>{const c=allCaretakers.find(x=>x.id===r.id);return c?{...c,_score:r.score,_reason:r.reason}:null;}).filter(Boolean);}
    if(!matches.length){box.innerHTML=`<div class="section-card"><h2>No matches found</h2><p style="color:#64748b">Try adding more caretakers or adjusting order requirements.</p></div>`;return;}
    const cards=matches.map(c=>{
      const initials=(c.name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      return`<div class="result-card">
        <div style="display:flex;gap:14px;align-items:flex-start">
          <div class="rc-avatar">${c.photoURL?`<img src="${esc(c.photoURL)}" onerror="this.style.display='none'">`:initials}</div>
          <div style="flex:1">
            <div class="match-score">⭐ ${c._score}% match</div>
            <div class="rc-name">${esc(c.name)}</div>
            <div class="rc-meta">${c.gender||''} · ${c.age?c.age+'y':''} · ₹${c.salary||'?'}/mo · ${c.experience||0}y exp</div>
            <div style="font-size:12px;color:#64748b;font-style:italic;margin:4px 0">${esc(c._reason||'')}</div>
            <div class="rc-tags">${(c.languages||[]).slice(0,3).map(l=>`<span class="rc-tag">${l}</span>`).join('')}${c.area?`<span class="rc-tag">📍${esc(c.area)}</span>`:''}</div>
          </div>
        </div>
        <div class="rc-actions" style="margin-top:12px">
          <button class="btn btn-ghost btn-sm" onclick="viewCaretaker('${c.id}')">View</button>
          <button class="btn btn-green btn-sm" onclick="assignFromMatch('${orderId}','${c.id}','${esc(c.name).replace(/'/g,"\\'")}')">Assign</button>
          <button class="btn btn-blue btn-sm" onclick="downloadProfile(allCaretakers.find(x=>x.id==='${c.id}'),false)">Full PDF</button>
          <button class="btn btn-ghost btn-sm" onclick="downloadProfile(allCaretakers.find(x=>x.id==='${c.id}'),true)">Brief PDF</button>
          ${c.phone?`<button class="btn btn-wa btn-sm" onclick="shareWhatsApp('${c.id}','${orderId}')">📱 Share</button>`:''}
        </div>
      </div>`;
    }).join('');
    box.innerHTML=`<div class="section-card"><h2>✨ Top ${matches.length} Matches — ${esc(o.orderId)}</h2><div class="result-grid">${cards}</div></div>`;
  }catch(e){box.innerHTML=`<div class="section-card"><p style="color:#ef4444">Error: ${e.message}</p></div>`;}
}

async function assignFromMatch(orderId,ctId,ctName){
  await db.collection('orders').doc(orderId).update({assignedCaretakerId:ctId,assignedCaretakerName:ctName,status:'assigned'});
  const idx=allOrders.findIndex(o=>o.id===orderId);if(idx>=0){allOrders[idx].assignedCaretakerId=ctId;allOrders[idx].assignedCaretakerName=ctName;allOrders[idx].status='assigned';}
  toast(`Assigned ${ctName} ✓`,'success');
  const box=document.getElementById('matchBox');if(box)box.innerHTML='';
  renderOrdTable(document.getElementById('ordSearch')?.value||'',document.getElementById('ordStatusFilter')?.value||'');
}

function shareWhatsApp(ctId,orderId){
  const c=allCaretakers.find(x=>x.id===ctId),o=allOrders.find(x=>x.id===orderId);if(!c)return;
  const msg=`Hi! Here is a caretaker profile from OutdoorSeniors:\n\n*${c.name}*\nGender: ${c.gender||'—'} | Age: ${c.age||'—'} | Experience: ${c.experience||0} yrs\nLanguages: ${(c.languages||[]).join(', ')||'—'}\nArea: ${c.area||'—'}\nExpected Salary: ₹${c.salary||'?'}/month\n\nFor: ${o?.patientName||'Patient'} (Order: ${o?.orderId||''})\n\nTo engage this caretaker, contact OutdoorSeniors.`;
  const num=c.phone?`91${c.phone.replace(/\D/g,'')}`:''
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`,'_blank');
}

// ─ Assign Modal ─
let assignOrderRef=null;
function openAssign(orderId){
  const o=allOrders.find(x=>x.id===orderId);assignOrderRef=o;
  document.getElementById('assignOrderLabel').textContent=o?.orderId||orderId;
  const sel=document.getElementById('assignCtSelect');
  sel.innerHTML=`<option value="">— Select Caretaker —</option>`+allCaretakers.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.gender||''}, ${c.area||''})</option>`).join('');
  openModal('assignModal');
}
async function confirmAssign(){
  const ctId=document.getElementById('assignCtSelect').value;if(!ctId||!assignOrderRef){toast('Select a caretaker','error');return;}
  const ct=allCaretakers.find(x=>x.id===ctId);
  await db.collection('orders').doc(assignOrderRef.id).update({assignedCaretakerId:ctId,assignedCaretakerName:ct?.name||'',status:'assigned'});
  const idx=allOrders.findIndex(o=>o.id===assignOrderRef.id);if(idx>=0){allOrders[idx].assignedCaretakerId=ctId;allOrders[idx].assignedCaretakerName=ct?.name||'';allOrders[idx].status='assigned';}
  toast('Caretaker assigned ✓','success');closeModal('assignModal');
  renderOrdTable(document.getElementById('ordSearch')?.value||'',document.getElementById('ordStatusFilter')?.value||'');
}

// ══ ANALYTICS ══
function renderAnalytics(ca){
  const now=new Date();
  const getStart=(mode)=>{
    if(mode==='daily')return new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if(mode==='weekly'){const d=new Date(now);d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d;}
    return new Date(now.getFullYear(),now.getMonth(),1);
  };
  const start=getStart(periodMode);
  const byPeriod=arr=>arr.filter(x=>x.createdAt?.toDate?.()>=start);
  const op=byPeriod(allOrders),cp=byPeriod(allCustomers),ctp=byPeriod(allCaretakers);
  const assigned=allOrders.filter(o=>o.status==='assigned'||o.status==='active');
  const pending=allOrders.filter(o=>o.status==='pending');
  const rate=allOrders.length?Math.round(assigned.length/allOrders.length*100):0;
  ca.innerHTML=`
  <div class="period-toggle">
    <button class="period-btn ${periodMode==='daily'?'active':''}" onclick="periodMode='daily';renderAnalytics(document.getElementById('contentArea'))">Daily</button>
    <button class="period-btn ${periodMode==='weekly'?'active':''}" onclick="periodMode='weekly';renderAnalytics(document.getElementById('contentArea'))">Weekly</button>
    <button class="period-btn ${periodMode==='monthly'?'active':''}" onclick="periodMode='monthly';renderAnalytics(document.getElementById('contentArea'))">Monthly</button>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="label">New Orders (${periodMode})</div><div class="value">${op.length}</div><div class="delta">${allOrders.length} total</div></div>
    <div class="kpi-card"><div class="label">New Customers (${periodMode})</div><div class="value">${cp.length}</div><div class="delta">${allCustomers.length} total</div></div>
    <div class="kpi-card"><div class="label">New Caretakers (${periodMode})</div><div class="value">${ctp.length}</div><div class="delta">${allCaretakers.length} total</div></div>
    <div class="kpi-card"><div class="label">Assigned Orders</div><div class="value">${assigned.length}</div><div class="delta">${rate}% assignment rate</div></div>
    <div class="kpi-card"><div class="label">Pending Orders</div><div class="value" style="color:#f59e0b">${pending.length}</div><div class="delta" style="color:#f59e0b">need action</div></div>
    <div class="kpi-card"><div class="label">Agents</div><div class="value">${allAgents.length}</div><div class="delta">field staff</div></div>
  </div>
  <div class="section-card"><h2>Orders by Status</h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      ${['pending','matched','assigned','active','closed'].map(s=>{
        const n=allOrders.filter(o=>o.status===s).length,pct=allOrders.length?Math.round(n/allOrders.length*100):0;
        const col={pending:'#f59e0b',matched:'#3b82f6',assigned:'#8b5cf6',active:'#10b981',closed:'#94a3b8'};
        return`<div style="flex:1;min-width:100px;background:#f8fafc;border-radius:10px;padding:16px;text-align:center"><div style="font-size:28px;font-weight:800;color:${col[s]}">${n}</div><div style="font-size:12px;color:#64748b;text-transform:capitalize;font-weight:600">${s}</div><div style="font-size:11px;color:#94a3b8">${pct}%</div></div>`;
      }).join('')}
    </div>
  </div>
  <div class="section-card"><h2>Package Distribution</h2>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${CARE_PACKAGES.map(p=>{
        const n=allOrders.filter(o=>o.packageType===p).length;if(!n)return'';
        const pct=allOrders.length?Math.round(n/allOrders.length*100):0;
        return`<div style="display:flex;align-items:center;gap:12px"><div style="width:190px;font-size:13px;color:#475569;flex-shrink:0">${p}</div><div style="flex:1;background:#f1f5f9;border-radius:6px;height:20px;overflow:hidden"><div style="width:${pct}%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);height:100%;border-radius:6px;transition:width .5s"></div></div><div style="width:40px;font-size:13px;font-weight:700;text-align:right">${n}</div></div>`;
      }).join('')||'<div class="empty-state">No orders yet to analyze.</div>'}
    </div>
  </div>`;
}

// ══ OMS ══
function renderOMS(ca){
  const now=new Date();
  const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const weekStart=new Date(now);weekStart.setDate(weekStart.getDate()-weekStart.getDay());weekStart.setHours(0,0,0,0);
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const byDate=start=>allOrders.filter(o=>o.createdAt?.toDate?.()>=start);
  const todayOrds=byDate(todayStart),weekOrds=byDate(weekStart),monthOrds=byDate(monthStart);
  const unassigned=allOrders.filter(o=>!o.assignedCaretakerId&&o.status!=='closed');
  ca.innerHTML=`
  <div class="kpi-grid">
    <div class="kpi-card"><div class="label">Today</div><div class="value">${todayOrds.length}</div><div class="delta">new orders</div></div>
    <div class="kpi-card"><div class="label">This Week</div><div class="value">${weekOrds.length}</div><div class="delta">new orders</div></div>
    <div class="kpi-card"><div class="label">This Month</div><div class="value">${monthOrds.length}</div><div class="delta">new orders</div></div>
    <div class="kpi-card"><div class="label">Unassigned</div><div class="value" style="color:#ef4444">${unassigned.length}</div><div class="delta" style="color:#ef4444">need action</div></div>
    <div class="kpi-card"><div class="label">Total Orders</div><div class="value">${allOrders.length}</div></div>
  </div>
  <div class="section-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0">All Orders</h2>
      <select onchange="omsFilter(this.value)" id="omsStatusF" style="border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;background:#fff">
        <option value="">All Status</option><option>pending</option><option>matched</option><option>assigned</option><option>active</option><option>closed</option>
      </select>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Order ID</th><th>Customer</th><th>Patient</th><th>Package</th><th>Status</th><th>Agent</th><th>Assigned To</th><th>Date</th><th>Change Status</th></tr></thead>
      <tbody id="omsTable">${buildOmsTable('')}</tbody>
    </table></div>
  </div>`;
}

function omsFilter(s){const t=document.getElementById('omsTable');if(t)t.innerHTML=buildOmsTable(s);}
function buildOmsTable(status){
  let data=status?allOrders.filter(o=>o.status===status):allOrders;
  if(!data.length)return`<tr><td colspan="9" class="empty-state">No orders.</td></tr>`;
  const sb={pending:'badge-yellow',matched:'badge-blue',assigned:'badge-purple',active:'badge-green',closed:'badge-gray'};
  return data.map(o=>`<tr>
    <td><strong style="font-family:monospace;font-size:12px">${esc(o.orderId)}</strong></td>
    <td>${esc(o.customerName||'—')}</td><td>${esc(o.patientName||'—')}</td>
    <td style="font-size:12px">${esc(o.packageType||'—')}</td>
    <td><span class="badge ${sb[o.status]||'badge-gray'}">${o.status}</span></td>
    <td style="font-size:12px">${esc(o.createdBy||'—')}</td>
    <td>${esc(o.assignedCaretakerName||'—')}</td>
    <td style="font-size:12px">${o.createdAt?.toDate?o.createdAt.toDate().toLocaleDateString('en-IN'):''}</td>
    <td><select onchange="updateOrdStatus('${o.id}',this.value)" style="border:1.5px solid #e2e8f0;border-radius:6px;padding:4px 8px;font-size:12px;outline:none">
      ${['pending','matched','assigned','active','closed'].map(s=>`<option${o.status===s?' selected':''}>${s}</option>`).join('')}
    </select></td>
  </tr>`).join('');
}
async function updateOrdStatus(id,status){
  await db.collection('orders').doc(id).update({status});
  const idx=allOrders.findIndex(o=>o.id===id);if(idx>=0)allOrders[idx].status=status;
  toast(`Status → ${status}`);
}

// ══ UTILS ══
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function syncPill(cb){cb.parentElement.classList.toggle('on',cb.checked);}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('open');}));
let _tt=null;
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3500);}
</script>
